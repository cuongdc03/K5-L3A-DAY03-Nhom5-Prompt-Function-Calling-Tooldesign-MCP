# starter_v0 — tool declarations.
tools:
  # ---------------- Core tools ----------------
  - name: clarify
    description: "Hỏi lại người dùng để làm rõ thông tin khi thiếu thông tin quan trọng (như thiếu link URL, thiếu tên tài khoản Twitter/X), hoặc yêu cầu người dùng xác nhận trước khi thực hiện hành động gửi tin nhắn (dùng response_type='yes_no'). KHÔNG dùng khi đã có đầy đủ thông tin."
    parameters:
      type: object
      properties:
        question: {type: string, default: "", description: "Câu hỏi làm rõ gửi tới người dùng"}
        response_type: {type: string, enum: [text, yes_no, choice], default: "text", description: "Kiểu phản hồi mong đợi: text (văn bản), yes_no (xác nhận có/không), hoặc choice (lựa chọn)"}
        options: {type: array, default: [], items: {type: string}, description: "Danh sách các lựa chọn nếu response_type là choice"}
      required: [question]

  - name: timeline
    description: "Lấy các bài đăng gần đây của một tài khoản Twitter/X cụ thể theo tên tài khoản (screenname, không có @). KHÔNG dùng khi người dùng muốn tìm kiếm theo từ khóa hoặc chủ đề chung."
    parameters:
      type: object
      properties:
        screenname: {type: string, default: "", description: "Tên tài khoản mạng xã hội (không bao gồm ký tự @, ví dụ: 'sama')"}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng cần lấy (mặc định 5)"}
      required: [screenname]

  - name: social_search
    description: "Tìm kiếm các bài đăng trên mạng xã hội Twitter/X theo từ khóa hoặc chủ đề. Dùng khi tìm kiếm theo từ khóa chung, KHÔNG dùng khi người dùng yêu cầu xem bài đăng của một tài khoản cụ thể."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa hoặc cụm từ tìm kiếm trên mạng xã hội"}
        search_type: {type: string, enum: [Latest, Top], default: "Latest", description: "Cách sắp xếp kết quả: Latest (mới nhất) hoặc Top (nổi bật nhất)"}
        limit: {type: integer, default: 5, description: "Số lượng bài đăng tối đa"}
      required: [query]

  - name: lookup
    description: "Tra cứu thông tin tổng hợp hoặc tin tức thời sự trên Internet qua công cụ tìm kiếm. Tham số query chỉ chứa từ khóa hoặc chủ đề cốt lõi (ví dụ: 'AI', KHÔNG lặp lại các từ 'news' hay 'tin tức'). Chọn topic='news' cho tin tức thời sự. Chọn timeframe='day' cho tin tức hôm nay."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa tìm kiếm cốt lõi (ví dụ 'AI')"}
        topic: {type: string, enum: [general, news], default: "general", description: "Phân loại tìm kiếm: general (chung) hoặc news (tin tức thời sự)"}
        timeframe: {type: string, enum: [day, week, month, year], default: "week", description: "Khoảng thời gian giới hạn: day (hôm nay), week (tuần qua), month (tháng qua), year (năm qua)"}
        max_results: {type: integer, default: 5, description: "Số kết quả tìm kiếm tối đa"}
      required: [query]

  - name: fetch
    description: "Đọc và trích xuất toàn bộ nội dung văn bản Markdown từ một địa chỉ liên kết web URL cụ thể. Chỉ dùng khi người dùng đã cung cấp đường link URL."
    parameters:
      type: object
      properties:
        url: {type: string, default: "", description: "Địa chỉ đường link URL đầy đủ (ví dụ: 'https://example.com/article')"}
      required: [url]

  - name: format
    description: "Trình bày và cấu trúc dữ liệu các mẩu tin đã thu thập được thành văn bản tóm tắt digest theo khuôn mẫu markdown. Dùng sau khi đã có dữ liệu từ các bước tìm kiếm trước đó."
    parameters:
      type: object
      properties:
        items:
          type: array
          default: []
          description: "Danh sách các item tin tức thu thập được"
          items:
            type: object
            properties:
              title: {type: string}
              url: {type: string}
              source: {type: string}
              summary: {type: string}
              section: {type: string}
        template: {type: string, enum: [brief, sections, bullets, thread, daily_ai_vn], default: "sections", description: "Khuôn mẫu định dạng"}
        headline: {type: string, default: "", description: "Tiêu đề bản tin tóm tắt"}
      required: [items, template]

  # ---------------- Bonus tools ----------------
  - name: send
    description: "Gửi một đoạn văn bản lên kênh truyền thông Telegram. CHỈ ĐƯỢC GỌI khi người dùng ĐÃ xác nhận rõ ràng rằng họ muốn gửi tin (confirmed=true). Nếu người dùng mới chỉ ra lệnh gửi mà chưa xác nhận, KHÔNG ĐƯỢC gọi tool này mà PHẢI gọi clarify(response_type='yes_no')."
    parameters:
      type: object
      properties:
        text: {type: string, default: "", description: "Nội dung văn bản tin nhắn cần gửi"}
        confirmed: {type: boolean, default: false, description: "Cờ xác nhận, chỉ đặt true khi người dùng đã đồng ý cho phép gửi"}
      required: [text]

  - name: policy
    description: "Tra cứu các quy định, chính sách và tiêu chuẩn nội bộ của công ty trong cẩm nang hướng dẫn nghiên cứu."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Nội dung hoặc chủ đề chính sách cần tra cứu"}
        policy_area: {type: string, enum: [all, ai_research, source_citation, data_privacy, external_publishing, tool_usage], default: "all", description: "Lĩnh vực chính sách cần tra cứu"}
        top_k: {type: integer, default: 3, description: "Số lượng quy định liên quan nhất cần trả về"}
      required: [query]

  - name: papers
    description: "Tìm kiếm các bài báo nghiên cứu khoa học học thuật trên cơ sở dữ liệu arXiv theo từ khóa hoặc chủ đề."
    parameters:
      type: object
      properties:
        query: {type: string, default: "", description: "Từ khóa hoặc chủ đề nghiên cứu khoa học"}
        max_results: {type: integer, default: 5, description: "Số lượng bài báo tối đa"}
        sort_by: {type: string, enum: [relevance, lastUpdatedDate, submittedDate], default: "relevance", description: "Cách sắp xếp: relevance (độ liên quan), lastUpdatedDate, submittedDate"}
      required: [query]

  - name: paper_text
    description: "Tải file PDF từ kho lưu trữ arXiv và trích xuất nội dung văn bản của bài báo để phục vụ nghiên cứu và tóm tắt."
    parameters:
      type: object
      properties:
        arxiv_url: {type: string, default: "", description: "Mã định danh paper ID hoặc đường link URL bài báo trên arXiv"}
        max_pages: {type: integer, default: 5, description: "Số trang tối đa cần trích xuất"}
        max_chars: {type: integer, default: 8000, description: "Số ký tự tối đa"}
      required: [arxiv_url]

  - name: wikipedia
    description: "Tra cứu bài viết tóm tắt trên Wikipedia (bách khoa toàn thư mở) theo tiêu đề hoặc chủ đề khái niệm, lịch sử, nhân vật, khoa học."
    parameters:
      type: object
      properties:
        title: {type: string, default: "", description: "Tiêu đề bài viết hoặc tên chủ đề cần tra cứu trên Wikipedia"}
        language: {type: string, enum: [en, vi, fr, de, ja], default: "en", description: "Mã ngôn ngữ (mặc định en)"}
      required: [title]

  - name: calculator
    description: "Thực hiện tính toán biểu thức số học hoặc hàm toán học (sqrt, pow, sin, cos, log) an toàn và chính xác. Dùng khi người dùng yêu cầu tính toán cụ thể."
    parameters:
      type: object
      properties:
        expression: {type: string, default: "", description: "Biểu thức toán học cần tính toán (ví dụ: '25 * 4 + 10' hoặc 'sqrt(144)')"}
      required: [expression]

  - name: crypto_price
    description: "Tra cứu tỷ giá và giá thị trường hiện tại của các đồng tiền mã hóa (coin/token như bitcoin, ethereum, solana...) theo các đồng tiền tệ (usd, vnd, eur)."
    parameters:
      type: object
      properties:
        coin_id: {type: string, default: "bitcoin", description: "Tên định danh đồng coin (ví dụ: 'bitcoin', 'ethereum', 'solana')"}
        currency: {type: string, default: "usd", description: "Đồng tiền tệ quy đổi (ví dụ: 'usd', 'vnd', 'eur')"}
      required: [coin_id]
